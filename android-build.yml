name: Android Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit / sandbox tests
        run: bash tests/run.sh
        continue-on-error: true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"

      - name: Upload NatroMobile debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NatroMobile-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package source archive
        run: |
          zip -r NatroMobile-Modified-Source.zip . \
            -x "app/build/*" \
            -x ".gradle/*" \
            -x "**/.git/*" \
            -x "*.apk"

      - name: Upload modified source
        uses: actions/upload-artifact@v4
        with:
          name: NatroMobile-Modified-Source
          path: NatroMobile-Modified-Source.zip
          if-no-files-found: error
